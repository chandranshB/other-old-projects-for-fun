<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance & Leave Tracker Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Lucide Icons ---
    const Calendar = ({ c = '', s = 24, sw = 2 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-calendar ${c}`}>
        <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
        <line x1="16" x2="16" y1="2" y2="6" />
        <line x1="8" x2="8" y1="2" y2="6" />
        <line x1="3" x2="21" y1="10" y2="10" />
      </svg>
    );

    const Target = ({ c = '', s = 24, sw = 2 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-target ${c}`}>
        <circle cx="12" cy="12" r="10" />
        <circle cx="12" cy="12" r="6" />
        <circle cx="12" cy="12" r="2" />
      </svg>
    );

    const Sparkles = ({ c = '', s = 24, sw = 2 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-sparkles ${c}`}>
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        <path d="M5 3v4" />
        <path d="M19 17v4" />
        <path d="M3 5h4" />
        <path d="M17 19h4" />
      </svg>
    );

    const ClipboardList = ({ c = '', s = 24, sw = 2 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-clipboard-list ${c}`}>
        <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
        <path d="M12 11h4" />
        <path d="M12 16h4" />
        <path d="M8 11h.01" />
        <path d="M8 16h.01" />
      </svg>
    );

    const Settings = ({ c = '', s = 24, sw = 2 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={`lucide lucide-sliders-horizontal ${c}`}>
        <line x1="21" x2="14" y1="4" y2="4" />
        <line x1="10" x2="3" y1="4" y2="4" />
        <line x1="21" x2="12" y1="12" y2="12" />
        <line x1="8" x2="3" y1="12" y2="12" />
        <line x1="21" x2="16" y1="20" y2="20" />
        <line x1="12" x2="3" y1="20" y2="20" />
        <line x1="14" x2="14" y1="2" y2="6" />
        <line x1="8" x2="8" y1="10" y2="14" />
        <line x1="16" x2="16" y1="18" y2="22" />
      </svg>
    );

    const ArrowLeft = ({ c = '', s = 20 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={c}>
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    );

    // --- THEME ENGINE ---
    const getThemeClasses = (design, isDarkMode) => {
      const themes = {
        cupertino: {
          light: {
            font: 'font-["Plus_Jakarta_Sans",_sans-serif]',
            pageBg: "bg-[#f2f2f7]",
            cardBg: "bg-white",
            cardRounding: "rounded-2xl",
            cardShadow: "shadow-sm border border-gray-200/60",
            headerFont: "text-3xl font-extrabold",
            settingsButton: "p-2.5 rounded-xl hover:bg-gray-200/70 transition-colors",
            iconStrokeWidth: 2,
            primaryText: "text-gray-900",
            secondaryText: "text-gray-600",
            secondarySubtle: "text-gray-400",
            tertiaryBg: "bg-gray-200/70",
            dividerColor: "bg-gray-100",
            inputColor: "text-gray-900 font-semibold",
            actionColor: "text-indigo-600",
            activeSegmentBg: "bg-white shadow",
            iconBgRed: "bg-red-50",
            iconColorRed: "text-red-600",
            iconBgGreen: "bg-emerald-50",
            iconColorGreen: "text-emerald-600",
            modalBg: "bg-white/85 backdrop-blur-xl border border-gray-200/80",
            modalRounding: "rounded-t-2xl md:rounded-2xl",
            modalShadow: "shadow-2xl",
            modalOpenAnimation: "animate-slide-up-cupertino",
            modalCloseAnimation: "animate-slide-down-cupertino",
            backdropOpenAnimation: "animate-fade-in-backdrop-fast",
            backdropCloseAnimation: "animate-fade-out-backdrop-fast"
          },
          dark: {
            font: 'font-["Plus_Jakarta_Sans",_sans-serif]',
            pageBg: "bg-[#0b0f19]",
            cardBg: "bg-[#151c2c]",
            cardRounding: "rounded-2xl",
            cardShadow: "shadow-lg shadow-black/40 border border-gray-800/80",
            headerFont: "text-3xl font-extrabold",
            settingsButton: "p-2.5 rounded-xl hover:bg-gray-800/70 transition-colors",
            iconStrokeWidth: 2,
            primaryText: "text-gray-100",
            secondaryText: "text-gray-400",
            secondarySubtle: "text-gray-500",
            tertiaryBg: "bg-gray-800/70",
            dividerColor: "bg-gray-800/80",
            inputColor: "text-white font-semibold",
            actionColor: "text-indigo-400",
            activeSegmentBg: "bg-gray-900 shadow",
            iconBgRed: "bg-red-950/60",
            iconColorRed: "text-red-400",
            iconBgGreen: "bg-emerald-950/60",
            iconColorGreen: "text-emerald-400",
            modalBg: "bg-[#151c2c]/95 backdrop-blur-xl border border-gray-800",
            modalRounding: "rounded-t-2xl md:rounded-2xl",
            modalShadow: "shadow-2xl shadow-black/60",
            modalOpenAnimation: "animate-slide-up-cupertino",
            modalCloseAnimation: "animate-slide-down-cupertino",
            backdropOpenAnimation: "animate-fade-in-backdrop-fast",
            backdropCloseAnimation: "animate-fade-out-backdrop-fast"
          }
        },
        material: {
          light: {
            font: 'font-["Roboto",_sans-serif]',
            pageBg: "bg-[#f4f7fc]",
            cardBg: "bg-white",
            cardRounding: "rounded-[28px]",
            cardShadow: "shadow-md shadow-indigo-100/60 border border-indigo-50",
            headerFont: "text-3xl font-bold",
            settingsButton: "p-2.5 rounded-full hover:bg-blue-100/70 transition-colors",
            iconStrokeWidth: 2.2,
            primaryText: "text-gray-800",
            secondaryText: "text-gray-600",
            secondarySubtle: "text-gray-400",
            tertiaryBg: "bg-blue-50",
            dividerColor: "bg-blue-50",
            inputColor: "text-blue-900 font-bold",
            actionColor: "text-blue-700",
            activeSegmentBg: "bg-white shadow-sm",
            iconBgRed: "bg-red-100",
            iconColorRed: "text-red-700",
            iconBgGreen: "bg-green-100",
            iconColorGreen: "text-green-700",
            modalBg: "bg-white border border-gray-100",
            modalRounding: "rounded-t-[28px] md:rounded-[28px]",
            modalShadow: "shadow-2xl",
            modalOpenAnimation: "animate-slide-up-material",
            modalCloseAnimation: "animate-slide-down-material",
            backdropOpenAnimation: "animate-fade-in-backdrop-slow",
            backdropCloseAnimation: "animate-fade-out-backdrop-slow"
          },
          dark: {
            font: 'font-["Roboto",_sans-serif]',
            pageBg: "bg-[#121620]",
            cardBg: "bg-[#1b2234]",
            cardRounding: "rounded-[28px]",
            cardShadow: "shadow-xl shadow-black/40 border border-gray-800",
            headerFont: "text-3xl font-bold",
            settingsButton: "p-2.5 rounded-full hover:bg-gray-700 transition-colors",
            iconStrokeWidth: 2.2,
            primaryText: "text-gray-100",
            secondaryText: "text-gray-400",
            secondarySubtle: "text-gray-500",
            tertiaryBg: "bg-gray-800",
            dividerColor: "bg-gray-800",
            inputColor: "text-white font-bold",
            actionColor: "text-sky-400",
            activeSegmentBg: "bg-gray-950 shadow-sm",
            iconBgRed: "bg-red-900/50",
            iconColorRed: "text-red-400",
            iconBgGreen: "bg-green-900/50",
            iconColorGreen: "text-green-400",
            modalBg: "bg-[#1b2234] border border-gray-700",
            modalRounding: "rounded-t-[28px] md:rounded-[28px]",
            modalShadow: "shadow-2xl shadow-black/50",
            modalOpenAnimation: "animate-slide-up-material",
            modalCloseAnimation: "animate-slide-down-material",
            backdropOpenAnimation: "animate-fade-in-backdrop-slow",
            backdropCloseAnimation: "animate-fade-out-backdrop-slow"
          }
        }
      };
      return themes[design][isDarkMode ? 'dark' : 'light'];
    };

    function SegmentedControl({ options, value, onChange, design, theme }) {
      const activeIndex = useMemo(() => options.findIndex(o => o.value === value), [options, value]);
      const itemWidth = 100 / options.length;

      return (
        <div className={`relative flex w-full ${theme.tertiaryBg} ${design === 'cupertino' ? 'rounded-xl p-1' : 'rounded-full p-1.5'}`}>
          <div
            className={`absolute top-1 bottom-1 ${theme.activeSegmentBg} ${design === 'cupertino' ? 'rounded-lg' : 'rounded-full'} transition-all duration-300 ease-in-out`}
            style={{
              width: `calc(${itemWidth}% - 4px)`,
              left: `calc(${activeIndex * itemWidth}% + 2px)`,
            }}
          />
          {options.map((option) => (
            <button
              key={option.value}
              onClick={() => onChange(option.value)}
              className={`relative z-10 flex-1 py-2 font-medium text-xs md:text-sm transition-colors duration-200 text-center ${
                value === option.value ? theme.actionColor : theme.secondaryText
              }`}
            >
              {option.label}
            </button>
          ))}
        </div>
      );
    }

    function Divider({ theme }) {
      return <div className={`h-px w-full ${theme.dividerColor}`} />;
    }

    function SettingsModal({ isOpen, onClose, isMobile, theme, design, setDesign, mode, setMode, targetPercent, setTargetPercent }) {
      const [isClosing, setIsClosing] = useState(false);
      const animationDuration = 300;

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(() => {
          onClose();
          setIsClosing(false);
        }, animationDuration);
      };

      if (!isOpen) return null;

      const appearanceOptions = [
        { value: 'light', label: 'Light' },
        { value: 'dark', label: 'Dark' },
        { value: 'system', label: 'System' }
      ];

      const designOptions = [
        { value: 'cupertino', label: 'Cupertino' },
        { value: 'material', label: 'Material You' }
      ];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="fixed inset-0 bg-black/50 backdrop-blur-sm" onClick={handleClose}></div>
          <div className={`relative z-50 w-full max-w-sm p-6 ${theme.modalBg} ${theme.modalRounding} ${theme.modalShadow} space-y-5 animate-fade-in`}>
            <div className="flex justify-between items-center pb-2">
              <h3 className={`text-lg font-bold ${theme.primaryText}`}>Preferences</h3>
              <button onClick={handleClose} className={`text-sm px-3 py-1 rounded-lg ${theme.tertiaryBg} ${theme.primaryText}`}>Done</button>
            </div>

            <div>
              <label className={`text-xs font-semibold ${theme.secondaryText} uppercase tracking-wider mb-2 block`}>Appearance</label>
              <SegmentedControl options={appearanceOptions} value={mode} onChange={setMode} design={design} theme={theme} />
            </div>

            <div>
              <label className={`text-xs font-semibold ${theme.secondaryText} uppercase tracking-wider mb-2 block`}>Design System</label>
              <SegmentedControl options={designOptions} value={design} onChange={setDesign} design={design} theme={theme} />
            </div>

            <div>
              <label className={`text-xs font-semibold ${theme.secondaryText} uppercase tracking-wider mb-2 block`}>Target Attendance (%)</label>
              <div className="flex gap-2">
                {[70, 75, 80, 85].map(pct => (
                  <button
                    key={pct}
                    onClick={() => setTargetPercent(pct)}
                    className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      targetPercent === pct ? 'bg-indigo-600 text-white' : `${theme.tertiaryBg} ${theme.secondaryText}`
                    }`}
                  >
                    {pct}%
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Main Attendance App ---
    function AttendanceCalculator() {
      const [inputMode, setInputMode] = useState('attendedMissed');
      const [totalClasses, setTotalClasses] = useState('');
      const [classesAttended, setClassesAttended] = useState('');
      const [classesMissed, setClassesMissed] = useState('');
      const [stats, setStats] = useState(null);
      const [errorMessage, setErrorMessage] = useState(null);
      const [targetPercent, setTargetPercent] = useState(75);

      const [design, setDesign] = useState('cupertino');
      const [mode, setMode] = useState('system');
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isMobile, setIsMobile] = useState(false);

      useEffect(() => {
        const checkMobile = () => setIsMobile(window.innerWidth < 768);
        checkMobile();
        window.addEventListener('resize', checkMobile);
        return () => window.removeEventListener('resize', checkMobile);
      }, []);

      useEffect(() => {
        if (mode === 'system') {
          const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          setIsDarkMode(mediaQuery.matches);
          const handler = (e) => setIsDarkMode(e.matches);
          mediaQuery.addEventListener('change', handler);
          return () => mediaQuery.removeEventListener('change', handler);
        } else {
          setIsDarkMode(mode === 'dark');
        }
      }, [mode]);

      const theme = getThemeClasses(design, isDarkMode);

      // Sarcastic witty validation messages
      const sarcasticMessages = [
        "Attended more classes than exist? Are you a time traveler?",
        "Missed more classes than the total? Impressive in a weird way.",
        "Negative classes? Did you accidentally un-learn a course?",
        "Your math is... exceptionally creative. Let's try real numbers.",
      ];

      useEffect(() => {
        setErrorMessage(null);
        let total = 0, attended = 0, missed = 0;
        const in_total = parseInt(totalClasses);
        const in_attended = parseInt(classesAttended);
        const in_missed = parseInt(classesMissed);

        try {
          if (inputMode === 'totalAttended') {
            if ((totalClasses && isNaN(in_total)) || (classesAttended && isNaN(in_attended))) {
              setErrorMessage(sarcasticMessages[0]); setStats(null); return;
            }
            total = in_total || 0;
            attended = in_attended || 0;
            if (attended < 0 || total < 0) { setErrorMessage("Negative classes? Really?"); setStats(null); return; }
            if (attended > total && total > 0) { setErrorMessage("Attended more classes than exist?"); setStats(null); return; }
            missed = total - attended;
            if (total > 0 && attended >= 0) setClassesMissed(String(missed));
          } else if (inputMode === 'totalMissed') {
            if ((totalClasses && isNaN(in_total)) || (classesMissed && isNaN(in_missed))) {
              setErrorMessage(sarcasticMessages[1]); setStats(null); return;
            }
            total = in_total || 0;
            missed = in_missed || 0;
            if (missed < 0 || total < 0) { setErrorMessage("Negative classes? Really?"); setStats(null); return; }
            if (missed > total && total > 0) { setErrorMessage("Missed more classes than the total?"); setStats(null); return; }
            attended = total - missed;
            if (total > 0 && missed >= 0) setClassesAttended(String(attended));
          } else if (inputMode === 'attendedMissed') {
            if ((classesAttended && isNaN(in_attended)) || (classesMissed && isNaN(in_missed))) {
              setErrorMessage(sarcasticMessages[2]); setStats(null); return;
            }
            attended = in_attended || 0;
            missed = in_missed || 0;
            if (attended < 0 || missed < 0) { setErrorMessage("Negative classes? Really?"); setStats(null); return; }
            total = attended + missed;
            if (attended >= 0 && missed >= 0) setTotalClasses(String(total));
          }
        } catch (err) {
          setErrorMessage(sarcasticMessages[3]); setStats(null); return;
        }

        if (total <= 0 || attended < 0 || missed < 0) {
          setStats(null);
          return;
        }

        const currentPercentage = (attended / total) * 100;
        const targetDecimal = targetPercent / 100;

        let classesToAttend = 0;
        if (currentPercentage < targetPercent) {
          classesToAttend = Math.ceil((targetDecimal * total - attended) / (1 - targetDecimal));
        }

        let canMiss = 0;
        if (currentPercentage >= targetPercent) {
          canMiss = Math.floor((attended - targetDecimal * total) / targetDecimal);
        }

        const future5 = ((attended + 5) / (total + 5)) * 100;
        const future10 = ((attended + 10) / (total + 10)) * 100;

        setStats({
          total,
          attended,
          missed,
          currentPercentage: currentPercentage.toFixed(1),
          classesToAttend: Math.max(0, classesToAttend),
          canMiss: Math.max(0, canMiss),
          future5: future5.toFixed(1),
          future10: future10.toFixed(1),
        });
      }, [totalClasses, classesAttended, classesMissed, inputMode, targetPercent]);

      const inputOptions = [
        { value: 'attendedMissed', label: 'Attended & Missed' },
        { value: 'totalAttended', label: 'Total & Attended' },
        { value: 'totalMissed', label: 'Total & Missed' },
      ];

      const getStatusColor = (percentage) => {
        if (percentage >= targetPercent) return 'text-emerald-500';
        if (percentage >= targetPercent - 10) return 'text-amber-500';
        return 'text-rose-500';
      };

      const getStatusMessage = (percentage) => {
        if (percentage >= targetPercent + 10) return 'Super Safe!';
        if (percentage >= targetPercent) return 'Safe Zone';
        if (percentage >= targetPercent - 10) return 'Warning: Near Boundary';
        return 'Critical: Attendance Low';
      };

      return (
        <div className={`min-h-screen p-4 md:p-8 ${theme.pageBg} ${theme.font} transition-colors duration-300`}>
          <style>{`
            @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
            .animate-fade-in { animation: fadeIn 0.35s ease-out forwards; }
            input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
            input[type=number] { -moz-appearance: textfield; }
          `}</style>

          <div className="max-w-md md:max-w-xl mx-auto space-y-5">
            {/* Top Navigation */}
            <div className="flex justify-between items-center pt-2">
              <a
                href="../../index.html"
                className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl text-xs md:text-sm font-semibold transition-all ${theme.tertiaryBg} ${theme.primaryText} hover:opacity-80`}
              >
                <ArrowLeft s={16} /> Hub Portfolio
              </a>
              <div className="flex items-center gap-2">
                <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg ${theme.tertiaryBg} ${theme.secondaryText}`}>
                  Goal: {targetPercent}%
                </span>
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className={theme.settingsButton}
                  title="Preferences"
                >
                  <Settings s={20} sw={theme.iconStrokeWidth} c={theme.primaryText} />
                </button>
              </div>
            </div>

            {/* Header */}
            <header className="pt-3 pb-1">
              <h1 className={`${theme.headerFont} ${theme.primaryText} flex items-center gap-3 tracking-tight`}>
                <Calendar c={theme.actionColor} s={32} sw={theme.iconStrokeWidth} />
                Attendance Tracker
              </h1>
              <p className={`text-sm ${theme.secondaryText} mt-1`}>
                Calculate safe bunks, recovery requirements, and attendance targets.
              </p>
            </header>

            {/* Input Card */}
            <div>
              <h2 className={`text-xs font-bold ${theme.secondaryText} uppercase tracking-wider px-2 pb-2`}>
                Input Data
              </h2>
              <div className={`${theme.cardBg} ${theme.cardRounding} ${theme.cardShadow} overflow-hidden`}>
                <div className="p-4">
                  <SegmentedControl
                    options={inputOptions}
                    value={inputMode}
                    onChange={setInputMode}
                    design={design}
                    theme={theme}
                  />
                </div>

                <Divider theme={theme} />

                {inputMode === 'attendedMissed' && (
                  <>
                    <div className="flex items-center justify-between p-4">
                      <label htmlFor="classes-attended" className={`text-sm md:text-base font-medium ${theme.primaryText}`}>
                        Classes Attended
                      </label>
                      <input
                        id="classes-attended"
                        type="number"
                        value={classesAttended}
                        onChange={(e) => setClassesAttended(e.target.value)}
                        className={`w-28 text-right ${theme.inputColor} text-lg bg-transparent border-none focus:outline-none p-0`}
                        placeholder="e.g. 38"
                        min="0"
                      />
                    </div>
                    <Divider theme={theme} />
                    <div className="flex items-center justify-between p-4">
                      <label htmlFor="classes-missed" className={`text-sm md:text-base font-medium ${theme.primaryText}`}>
                        Classes Missed
                      </label>
                      <input
                        id="classes-missed"
                        type="number"
                        value={classesMissed}
                        onChange={(e) => setClassesMissed(e.target.value)}
                        className={`w-28 text-right ${theme.inputColor} text-lg bg-transparent border-none focus:outline-none p-0`}
                        placeholder="e.g. 10"
                        min="0"
                      />
                    </div>
                  </>
                )}

                {inputMode === 'totalAttended' && (
                  <>
                    <div className="flex items-center justify-between p-4">
                      <label htmlFor="total-classes" className={`text-sm md:text-base font-medium ${theme.primaryText}`}>
                        Total Classes
                      </label>
                      <input
                        id="total-classes"
                        type="number"
                        value={totalClasses}
                        onChange={(e) => setTotalClasses(e.target.value)}
                        className={`w-28 text-right ${theme.inputColor} text-lg bg-transparent border-none focus:outline-none p-0`}
                        placeholder="e.g. 48"
                        min="0"
                      />
                    </div>
                    <Divider theme={theme} />
                    <div className="flex items-center justify-between p-4">
                      <label htmlFor="classes-attended" className={`text-sm md:text-base font-medium ${theme.primaryText}`}>
                        Classes Attended
                      </label>
                      <input
                        id="classes-attended"
                        type="number"
                        value={classesAttended}
                        onChange={(e) => setClassesAttended(e.target.value)}
                        className={`w-28 text-right ${theme.inputColor} text-lg bg-transparent border-none focus:outline-none p-0`}
                        placeholder="e.g. 38"
                        min="0"
                      />
                    </div>
                  </>
                )}

                {inputMode === 'totalMissed' && (
                  <>
                    <div className="flex items-center justify-between p-4">
                      <label htmlFor="total-classes" className={`text-sm md:text-base font-medium ${theme.primaryText}`}>
                        Total Classes
                      </label>
                      <input
                        id="total-classes"
                        type="number"
                        value={totalClasses}
                        onChange={(e) => setTotalClasses(e.target.value)}
                        className={`w-28 text-right ${theme.inputColor} text-lg bg-transparent border-none focus:outline-none p-0`}
                        placeholder="e.g. 48"
                        min="0"
                      />
                    </div>
                    <Divider theme={theme} />
                    <div className="flex items-center justify-between p-4">
                      <label htmlFor="classes-missed" className={`text-sm md:text-base font-medium ${theme.primaryText}`}>
                        Classes Missed
                      </label>
                      <input
                        id="classes-missed"
                        type="number"
                        value={classesMissed}
                        onChange={(e) => setClassesMissed(e.target.value)}
                        className={`w-28 text-right ${theme.inputColor} text-lg bg-transparent border-none focus:outline-none p-0`}
                        placeholder="e.g. 10"
                        min="0"
                      />
                    </div>
                  </>
                )}
              </div>
            </div>

            {/* Error Message */}
            {errorMessage && (
              <div className="text-center px-4 py-2 text-sm text-rose-500 bg-rose-500/10 rounded-xl border border-rose-500/20 animate-fade-in">
                {errorMessage}
              </div>
            )}

            {/* Results */}
            {stats && (
              <div className="space-y-4 animate-fade-in">
                <h2 className={`text-xs font-bold ${theme.secondaryText} uppercase tracking-wider px-2 pt-2`}>
                  Live Analysis
                </h2>

                <div className={`${theme.cardBg} ${theme.cardRounding} ${theme.cardShadow} overflow-hidden`}>
                  <div className="p-5 flex items-center justify-between">
                    <div>
                      <span className={`text-sm font-semibold ${theme.secondaryText}`}>Attendance Score</span>
                      <div className={`text-xs ${theme.secondarySubtle} mt-0.5`}>Current standing</div>
                    </div>
                    <div className="text-right">
                      <span className={`text-4xl font-extrabold tracking-tight ${getStatusColor(stats.currentPercentage)}`}>
                        {stats.currentPercentage}%
                      </span>
                      <div className={`text-xs font-semibold ${theme.secondaryText} mt-0.5`}>
                        {getStatusMessage(stats.currentPercentage)}
                      </div>
                    </div>
                  </div>

                  <Divider theme={theme} />

                  {/* Progress Bar with Target Flag */}
                  <div className="p-5">
                    <div className={`relative w-full ${theme.tertiaryBg} rounded-full h-3 overflow-hidden`}>
                      <div
                        className="h-full rounded-full transition-all duration-700"
                        style={{
                          width: `${Math.min(stats.currentPercentage, 100)}%`,
                          backgroundColor: stats.currentPercentage >= targetPercent ? '#10b981' : (stats.currentPercentage >= targetPercent - 10 ? '#f59e0b' : '#f43f5e'),
                        }}
                      />
                    </div>
                    <div className="flex justify-between items-center text-xs text-gray-400 mt-2">
                      <span>0%</span>
                      <span className="font-semibold text-indigo-500">Target: {targetPercent}%</span>
                      <span>100%</span>
                    </div>
                  </div>

                  <Divider theme={theme} />

                  {stats.currentPercentage < targetPercent ? (
                    <div className="p-5 flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <div className={`w-10 h-10 flex items-center justify-center ${theme.iconBgRed} rounded-xl`}>
                          <Target c={theme.iconColorRed} s={20} sw={theme.iconStrokeWidth} />
                        </div>
                        <div>
                          <div className={`font-semibold ${theme.primaryText}`}>Classes to Attend</div>
                          <div className={`text-xs ${theme.secondarySubtle}`}>To reach {targetPercent}% target</div>
                        </div>
                      </div>
                      <span className="text-2xl font-bold text-rose-500">
                        +{stats.classesToAttend}
                      </span>
                    </div>
                  ) : (
                    <div className="p-5 flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <div className={`w-10 h-10 flex items-center justify-center ${theme.iconBgGreen} rounded-xl`}>
                          <Sparkles c={theme.iconColorGreen} s={20} sw={theme.iconStrokeWidth} />
                        </div>
                        <div>
                          <div className={`font-semibold ${theme.primaryText}`}>Safe to Bunk</div>
                          <div className={`text-xs ${theme.secondarySubtle}`}>Can miss without dropping below {targetPercent}%</div>
                        </div>
                      </div>
                      <span className="text-2xl font-bold text-emerald-500">
                        {stats.canMiss}
                      </span>
                    </div>
                  )}

                  <Divider theme={theme} />

                  <div className="p-4 flex items-center justify-between text-xs md:text-sm">
                    <span className={theme.secondaryText}>Summary</span>
                    <div className={`font-medium ${theme.primaryText}`}>
                      <span className="text-emerald-500 font-bold">{stats.attended}</span> Attended &bull;{' '}
                      <span className="text-rose-500 font-bold">{stats.missed}</span> Missed &bull;{' '}
                      <span>{stats.total} Total</span>
                    </div>
                  </div>
                </div>

                {/* Projections Card */}
                <div className={`${theme.cardBg} ${theme.cardRounding} ${theme.cardShadow} overflow-hidden p-5`}>
                  <h3 className={`text-xs font-bold ${theme.secondaryText} uppercase tracking-wider mb-4`}>
                    Upcoming Projections (If Attended)
                  </h3>
                  <div className="grid grid-cols-2 gap-3">
                    <div className={`p-3.5 rounded-xl ${theme.tertiaryBg}`}>
                      <div className={`text-xs ${theme.secondarySubtle}`}>After 5 classes</div>
                      <div className={`text-xl font-bold ${theme.primaryText} mt-1`}>{stats.future5}%</div>
                    </div>
                    <div className={`p-3.5 rounded-xl ${theme.tertiaryBg}`}>
                      <div className={`text-xs ${theme.secondarySubtle}`}>After 10 classes</div>
                      <div className={`text-xl font-bold ${theme.primaryText} mt-1`}>{stats.future10}%</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Empty State */}
            {!stats && !errorMessage && (
              <div className={`text-center py-16 ${theme.secondarySubtle}`}>
                <ClipboardList c="mx-auto text-gray-400 opacity-60" s={52} sw={theme.iconStrokeWidth} />
                <p className="mt-3 font-medium text-sm md:text-base">Enter attendance numbers above</p>
                <p className="text-xs">Real-time stats and bunk calculations will appear here</p>
              </div>
            )}
          </div>

          <SettingsModal
            isOpen={isSettingsOpen}
            onClose={() => setIsSettingsOpen(false)}
            isMobile={isMobile}
            theme={theme}
            design={design}
            setDesign={setDesign}
            mode={mode}
            setMode={setMode}
            targetPercent={targetPercent}
            setTargetPercent={setTargetPercent}
          />
        </div>
      );
    }

    ReactDOM.render(<AttendanceCalculator />, document.getElementById('root'));
  </script>
</body>
</html>
